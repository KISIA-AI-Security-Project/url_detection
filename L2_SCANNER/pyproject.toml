# L2 Scanner 패키지 설정 — 설치하면 실행 위치와 무관하게 `import l2_scanner`가 동작한다.
# 개발 설치: pip install -e .   (코드 수정이 즉시 반영되는 editable 모드)
# 배포 이미지(Fargate)에서는 pip install . 로 고정 설치.
# 8/28 5차 멘토링 지시 사항: 상대경로 import 금지, 패키지·라이브러리 형태로 구성.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "l2-scanner"
version = "1.0.0"
description = "악성 URL 분석 파이프라인의 L2(응답·통신 분석) 계층 — HTTP·리다이렉트·TLS 인증서 관측"
requires-python = ">=3.11"
# 버전은 requirements.txt와 같은 값을 유지한다 (두 곳이 어긋나면 requirements.txt 기준으로 맞출 것)
dependencies = [
    "httpx==0.28.1",
    "tldextract==5.3.2",
    "cryptography==50.0.0",
    'python-magic==0.4.27; sys_platform != "win32"',      # 배포(Linux) 기준 — 이미지에 libmagic1 필요
    'python-magic-bin==0.4.14; sys_platform == "win32"',  # 로컬 개발(Windows) 편의용
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["l2_scanner*"]
