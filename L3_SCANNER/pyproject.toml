[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l3-scanner"
version = "0.1.0"
description = "Standalone L3 HTML and JavaScript signal scanner"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = [".."]
include = ["L3_SCANNER*"]
exclude = ["L3_SCANNER.tests*"]

[tool.setuptools.package-data]
"L3_SCANNER.policies" = ["*.json"]
"L3_SCANNER.brands" = ["data/*.json", "data/*.txt", "data/*.md"]

[tool.deptry]
known_first_party = ["L3_SCANNER", "url_collector"]

[tool.deptry.per_rule_ignores]
# BeautifulSoup loads the required "lxml" parser by name in parse_html.
DEP002 = ["lxml"]
