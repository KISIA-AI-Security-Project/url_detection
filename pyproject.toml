[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l3-scanner"
version = "0.1.0"
description = "Standalone L3 HTML and JavaScript signal scanner"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["L3_SCANNER/requirements.txt"] }

[tool.setuptools.packages.find]
include = ["L3_SCANNER*"]
exclude = ["L3_SCANNER.tests*"]
