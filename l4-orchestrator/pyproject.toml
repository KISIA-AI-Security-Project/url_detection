[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "l4-orchestrator"
version = "0.1.0"
description = "Design-driven L4 investigation with OpenAI Agents SDK and caller-owned Tools"
requires-python = ">=3.12"
dependencies = ["openai-agents==0.22.3", "pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
browser = ["playwright==1.63.0"]
aws = ["boto3>=1.40,<2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
l4_orchestrator = ["_browser/*.js", "_browser/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", ".."]
